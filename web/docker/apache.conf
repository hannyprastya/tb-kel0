# docker/apache.conf: situs Laravel di Apache (menggantikan 000-default.conf).
# Hanya folder public/ yang bisa dibuka lewat URL (P12 temuan T-01, P13
# C.4): kode, vendor/, .env, composer.lock, storage/ berada di luar docroot.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # berkas yang tidak ada (semua rute Laravel) diteruskan ke index.php
        FallbackResource /index.php
        # header Authorization (mis. Bearer token API) diteruskan ke PHP
        CGIPassAuth On
    </Directory>

    # berkas tersembunyi (.htaccess, .env, .git) tidak pernah dilayani
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # header keamanan dasar (P12 checklist konfigurasi)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # P13 C.4 (temuan T-08, kelompok 0): HTTPS saja selama 1 tahun (browser
    # mengabaikan header ini di http://localhost) dan CSP dasar yang tidak
    # memutus Vite/Alpine: tidak boleh dibingkai situs lain, <base> hanya ke
    # situs sendiri, tanpa plugin <object>/<embed>.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

    # log ke stdout/stderr container; probe /health dan /healthz tidak
    # dicatat supaya log tidak penuh baris healthcheck
    SetEnvIf Request_URI "^/healthz?$" tanpa_log
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!tanpa_log
</VirtualHost>
