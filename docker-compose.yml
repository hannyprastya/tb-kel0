# docker-compose.yml (P7 slide 25; P10 image, P13 WORKERS)
services:
  app:
    build: .
    image: ${IMAGE:-tb-app:dev}   # P10: di CI = image yang diuji lalu di-push
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://app:latihan@db:5432/app
      WORKERS: ${WORKERS:-4}      # P13 C.1: jumlah worker Apache
    healthcheck:                     # --wait menunggu Apache benar-benar siap
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "localhost:8080/healthz"]
      interval: 3s
      retries: 10
    depends_on:
      db: { condition: service_healthy }   # app menunggu db sehat
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: latihan     # hanya untuk latihan lokal (ADR 0004)
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:                     # pg_isready tiap 3 detik, maks. 10 kali
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 3s
      retries: 10
volumes: { dbdata: {} }
