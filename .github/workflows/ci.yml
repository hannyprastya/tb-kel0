# .github/workflows/ci.yml (P10 slide 7-9 + P12 slide 18-19):
# scan kode & konfigurasi -> build -> test -> scan image -> push -> deploy
# Tanpa secret apa pun run tetap hijau: Push memakai GITHUB_TOKEN bawaan,
# Deploy hanya jalan bila variabel repo RENDER_ENABLED = true (README).
name: ci-cd
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }   # PR: scan + build + test saja
concurrency:                           # PR baru membatalkan run PR lama
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test-deploy:                   # nama check di ruleset (P10 A.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ---- P12: gagal cepat, sebelum build (slide 19)
      - name: Scan dependensi (composer audit)
        run: >-
          docker run --rm -v "$PWD:/app" -w /app composer:2.10.3
          composer audit --locked
      - name: Scan kode (PHPStan level 5)
        # vendor/ dipasang dulu agar kelas AWS SDK dikenal; vendor/ tidak
        # ikut ke image (.dockerignore) dan tidak di-commit (.gitignore)
        run: |
          docker run --rm -v "$PWD:/app" -w /app composer:2.10.3 \
            composer install --no-dev --no-interaction --prefer-dist -q
          docker run --rm -v "$PWD:/app" -w /app \
            ghcr.io/phpstan/phpstan:2.3.1-php8.4 \
            analyse --level 5 --no-progress \
            --autoload-file vendor/autoload.php index.php
      - name: Scan kode (Semgrep p/default)
        run: >-
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.182.1
          semgrep scan --config p/default --error --metrics=off --quiet
      - name: Scan konfigurasi (trivy config) dan secret (trivy fs)
        # trivy fs otomatis memakai trivy-secret.yaml (aturan password P12
        # D.3 + allow-rules untuk password latihan yang sudah diputuskan).
        run: |
          T="docker run --rm -v $PWD:/src -w /src aquasec/trivy:0.76.0"
          $T config --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs vendor .
          $T fs --scanners secret --skip-dirs vendor --exit-code 1 .

      # ---- P10: build dan uji image yang sama dengan yang akan di-push
      - name: Nama image
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/$REPO:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -t "$IMAGE" .
      - name: Test (uji fungsional F-01..F-12 terhadap compose)
        run: |
          docker compose up -d --wait
          curl -fsS --retry 3 --retry-connrefused localhost:8080/health
          bash tests/fungsional.sh
      - name: Log aplikasi bila Test gagal
        if: failure()
        run: docker compose logs --tail 50

      # ---- P12 slide 18: image dipindai sebelum push; ada CRITICAL = merah
      - name: Scan image, gagal bila CRITICAL
        # trivy-action v0.36.0, dikunci SHA penuh (bukan tag)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.76.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---- push hanya dari main; GITHUB_TOKEN berlaku selama job saja
      - name: Push ke GHCR
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AKTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$AKTOR" --password-stdin
          docker push "$IMAGE"
      - name: Deploy ke Render (bila RENDER_ENABLED = true)
        if: github.event_name == 'push' && vars.RENDER_ENABLED == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: >-
          curl -fsS -X POST -G "$HOOK"
          --data-urlencode "imgURL=$IMAGE"
