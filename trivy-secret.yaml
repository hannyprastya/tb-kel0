# trivy-secret.yaml (P12 D.3): aturan tambahan selain aturan bawaan Trivy
rules:
  - id: password-di-berkas
    category: general
    title: Password ditulis langsung di berkas konfigurasi
    severity: HIGH
    keywords: [password]
    regex: (?i)password["']?\s*[:=,]\s*(value:\s*)?(?P<secret>[^\s"',{}]{4,})
    secret-group-name: secret
  - id: password-di-url-db
    category: general
    title: Password di dalam connection string PostgreSQL
    severity: HIGH
    keywords: [postgres]
    regex: postgres(ql)?://[^:/\s]+:(?P<secret>[^@\s]+)@
    secret-group-name: secret
# P12 G.6: temuan D.3 yang sudah DIPUTUSKAN (ADR 0004) tidak dilaporkan
# lagi, supaya CI tetap merah bila ada password BARU di berkas lain.
allow-rules:
  - id: password-latihan-lab
    description: password latihan compose/kind, risiko diterima (ADR 0004)
    regex: latihan
  - id: contoh-url-di-komentar
    description: komentar contoh user:pass di app/index.php (alarm palsu)
    regex: "//user:pass@"
