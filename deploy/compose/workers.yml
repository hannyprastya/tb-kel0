# docker-compose.workers.yml (P11 Bagian B): batasi worker Apache.
# Pakai (B.3): tambahkan ke COMPOSE_FILE, lalu isi WORKERS=1 atau 4.
# Di contoh ini: deploy/compose/workers.yml; path relatif dari akar repo.
services:
  app:
    environment:
      WORKERS: ${WORKERS:-1}
    volumes:
      - ./deploy/compose/apache-proses.conf:/etc/apache2/conf-enabled/workers.conf:ro
