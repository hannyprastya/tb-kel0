# deploy/compose/nginx.conf (P13 C.2 + C.3): satu pintu untuk banyak replika app, dan cache
# hanya untuk halaman publik yang sama bagi semua orang (katalog /buku dan
# buku tamu /). POST, /buku/status, dan /health TIDAK di-cache, supaya stok
# dan gangguan database tetap terlihat apa adanya.
proxy_cache_path /var/cache/nginx/web keys_zone=web:10m max_size=100m;
upstream app_up {
    zone app_up 64k;                 # status dibagi semua worker Nginx
    least_conn;
    server app:8080 max_fails=3 fail_timeout=10s;
}
server {
    listen 80;
    add_header X-Kelompok "0" always;
    add_header X-Server $upstream_addr always;   # replika yang menjawab
    add_header X-Cache-Status $upstream_cache_status always;
    location ~ ^/(buku)?$ {          # "/" dan "/buku": boleh di-cache
        proxy_pass http://app_up;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_cache web;
        proxy_cache_valid 200 1m;    # simpan 1 menit (TTL); data basi <= 1 m
    }
    location / {                     # POST, /buku/status, /health: langsung
        proxy_pass http://app_up;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
    }
}
