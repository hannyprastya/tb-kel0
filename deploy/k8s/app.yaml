# deploy/k8s/app.yaml (P8 B.4, dipakai lab P13): buku tamu + perpustakaan dan
# PostgreSQL di kind. Namespace milik pemilik manifest (Raka, 99000001);
# anggota lain mengganti nim-99000001 dengan NIM sendiri (P13 A.1).
# Password latihan hanya untuk klaster lab, risiko diterima di ADR 0004.
apiVersion: v1
kind: Namespace
metadata: { name: nim-99000001 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: db, namespace: nim-99000001 }
spec:
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      securityContext:                   # P13 C.4: proses postgres bukan root
        runAsNonRoot: true
        runAsUser: 70                    # user postgres di image alpine
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:                           # latihan lokal (ADR 0004)
            - { name: POSTGRES_USER, value: app }
            - { name: POSTGRES_PASSWORD, value: latihan }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, app] }
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # tulis hanya ke emptyDir
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:                           # lab: data hilang bila Pod dihapus
        - { name: data, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: nim-99000001 }
spec:
  selector: { app: db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: nim-99000001 }
spec:
  replicas: 2                            # HPA (hpa.yaml) mengatur 2-6
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext:                   # P13 C.4 hardening (slide 27)
        runAsNonRoot: true               # tolak image yang berjalan root
        runAsUser: 33                    # www-data; wajib berupa angka
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: cc-nim-app:1.1          # docker build + kind load (P13 C.4)
          imagePullPolicy: IfNotPresent  # image dari kind load, bukan registry
          env:
            - name: DATABASE_URL
              value: "postgresql://app:latihan@db:5432/app"
            - { name: WORKERS, value: "4" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:                # siap menerima trafik? (cek DB)
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          livenessProbe:                 # proses hidup? gagal 3x -> restart
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:                     # jeda 5 dtk sebelum berhenti: Service
            preStop: { sleep: { seconds: 5 } }   # sempat mencoret Pod ini
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # Apache hanya menulis ke emptyDir
            capabilities: { drop: [ALL] }
          resources:                     # P13 C.5: dari docker stats/kubectl top
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 1000m, memory: 256Mi }
          volumeMounts:
            - { name: run, mountPath: /var/run/apache2 }
            - { name: lock, mountPath: /var/lock/apache2 }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: lock, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: nim-99000001 }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
